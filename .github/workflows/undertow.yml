name: Undertow Risk Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      model_urn:
        description: "mlModel URN to evaluate"
        required: false
        default: "urn:li:mlModel:(urn:li:dataPlatform:sagemaker,fraud_detector_v3,PROD)"

jobs:
  undertow-check:
    name: Lineage-Grounded Deploy Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Undertow
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Evaluate Upstream Lineage & Risk Policy
        id: undertow_gate
        env:
          DATAHUB_GMS_URL: ${{ secrets.DATAHUB_GMS_URL || 'http://localhost:8080' }}
          DATAHUB_GMS_TOKEN: ${{ secrets.DATAHUB_GMS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL_URN: ${{ github.event.inputs.model_urn || secrets.MODEL_URN || 'urn:li:mlModel:(urn:li:dataPlatform:sagemaker,fraud_detector_v3,PROD)' }}
        run: |
          undertow check --model "$MODEL_URN" --write-back

      - name: Post PR Comment on Failure or Warning
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let summaryText = "### 🔴 Undertow Risk Gate Failed\n\nUpstream lineage changes violated production risk policy. See workflow logs for full attribution details.";
            if (process.env.GITHUB_STEP_SUMMARY && fs.existsSync(process.env.GITHUB_STEP_SUMMARY)) {
              const content = fs.readFileSync(process.env.GITHUB_STEP_SUMMARY, 'utf8');
              if (content.trim()) {
                summaryText = content;
              }
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summaryText
            });
