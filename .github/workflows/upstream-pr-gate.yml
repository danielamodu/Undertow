name: Undertow Upstream Check

# Runs on the pull request that changes the SQL, not the one that deploys the
# model. Copy this into the repository that holds your dbt models or warehouse
# SQL — the transforms, not the training code.
#
# It parses the changed statements, compares the columns they would produce
# against the columns those tables have in DataHub today, and comments on the PR
# when something a production model depends on is going away.
#
# Informational by default. The check knows a column is disappearing; it does not
# know whether that is intended, and a check that fails every deliberate column
# removal gets switched off. Add `--fail-on-impact` when a team wants it blocking.

on:
  pull_request:
    paths:
      - "**.sql"
  workflow_dispatch:

jobs:
  upstream-impact:
    name: Columns this PR removes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Need the base commit to diff against.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Undertow
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Require a DataHub to check against
        env:
          DATAHUB_GMS_URL: ${{ secrets.DATAHUB_GMS_URL }}
        run: |
          if [ -z "$DATAHUB_GMS_URL" ]; then
            echo "::error::DATAHUB_GMS_URL is not set. This check compares changed SQL against the catalog; set the repository secret before enabling it."
            exit 1
          fi

      - name: Collect changed SQL
        id: changed
        run: |
          git diff --name-only --diff-filter=d \
            "origin/${{ github.base_ref }}...HEAD" -- '*.sql' > changed.txt
          echo "count=$(wc -l < changed.txt)" >> "$GITHUB_OUTPUT"
          echo "Changed SQL files:"
          cat changed.txt

      - name: Check impact
        if: steps.changed.outputs.count != '0'
        env:
          DATAHUB_GMS_URL: ${{ secrets.DATAHUB_GMS_URL }}
          DATAHUB_GMS_TOKEN: ${{ secrets.DATAHUB_GMS_TOKEN }}
        run: |
          # xargs so the whole changed set is one invocation, and one
          # SchemaResolver is shared across the files.
          xargs -a changed.txt undertow impact --platform snowflake

      - name: Comment on the PR
        if: steps.changed.outputs.count != '0' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = process.env.GITHUB_STEP_SUMMARY;
            if (!path || !fs.existsSync(path)) return;
            const body = fs.readFileSync(path, 'utf8').trim();
            if (!body) return;

            // Replace Undertow's previous comment rather than stacking a new one
            // on every push — a PR with fifteen identical bot comments gets muted.
            const marker = 'Undertow: this PR removes columns';
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }
