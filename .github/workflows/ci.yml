name: CI

# Runs on every push and PR. This is the workflow that has to be green: it
# proves the test suite, the lint rules, and the type contract on a machine
# that is not the author's.
#
# The deploy gate itself lives in `deploy-gate.yml` and is dispatch-only,
# because it needs a reachable DataHub and a hosted runner does not have one.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor `mcp-server-datahub` requires; 3.12 catches
        # anything that only works on the oldest supported interpreter.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # The documented install, verbatim. If a reviewer following the README
      # would hit a missing dependency, this job hits it first.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify the documented commands are importable
        run: |
          undertow --version
          python -c "import mcp, mcp_server_datahub, anthropic"

      - name: Tests
        run: pytest -q

      # Outside `testpaths`, so it needs asking for by name. It is the proposed
      # upstream contribution and has to keep working against the pinned SDK.
      - name: Proposed upstream patch builder
        run: pytest contrib/datahub-mlmodel-patch-builder/ -q

  action:
    name: Reusable action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The action is what adopters actually consume, and it was shipped once
      # without ever being executed. CI cannot exercise the gate itself — that
      # needs a reachable DataHub — but it can prove the composite action parses,
      # runs, and guards its inputs, which is where the two bugs found by
      # inspection actually lived.
      - name: Rejects a missing model
        id: no-model
        continue-on-error: true
        uses: ./
        with:
          datahub-url: "http://localhost:8080"

      - name: ...and says so rather than passing
        shell: bash
        run: |
          if [ "${{ steps.no-model.outcome }}" != "failure" ]; then
            echo "::error::The action accepted a run with no model and no 'all'."
            exit 1
          fi

      - name: Rejects a missing DataHub URL
        id: no-url
        continue-on-error: true
        uses: ./
        with:
          model: "urn:li:mlModel:(urn:li:dataPlatform:sagemaker,fraud_detector_v3,PROD)"
          datahub-url: ""

      - name: ...and says so rather than passing
        shell: bash
        run: |
          if [ "${{ steps.no-url.outcome }}" != "failure" ]; then
            echo "::error::The action accepted a run with no DataHub URL."
            exit 1
          fi

      - name: Installs and reaches the gate, which fails closed with no DataHub
        id: unreachable
        continue-on-error: true
        uses: ./
        with:
          model: "urn:li:mlModel:(urn:li:dataPlatform:sagemaker,fraud_detector_v3,PROD)"
          datahub-url: "http://127.0.0.1:59999"
          write-back: "false"

      - name: ...reporting exit 2, not a pass
        shell: bash
        run: |
          echo "verdict=${{ steps.unreachable.outputs.verdict }}"
          echo "exit-code=${{ steps.unreachable.outputs.exit-code }}"
          if [ "${{ steps.unreachable.outputs.exit-code }}" != "2" ]; then
            echo "::error::Expected exit 2 from an unreachable DataHub, got '${{ steps.unreachable.outputs.exit-code }}'. A gate that cannot see must never report a pass."
            exit 1
          fi
          if [ "${{ steps.unreachable.outputs.verdict }}" != "ERROR" ]; then
            echo "::error::Expected verdict ERROR, got '${{ steps.unreachable.outputs.verdict }}'."
            exit 1
          fi

  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src/ tests/ scripts/

      - name: Mypy
        run: mypy src/
