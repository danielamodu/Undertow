name: CI

# Runs on every push and PR. This is the workflow that has to be green: it
# proves the test suite, the lint rules, and the type contract on a machine
# that is not the author's.
#
# The deploy gate itself lives in `deploy-gate.yml` and is dispatch-only,
# because it needs a reachable DataHub and a hosted runner does not have one.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor `mcp-server-datahub` requires; 3.12 catches
        # anything that only works on the oldest supported interpreter.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # The documented install, verbatim. If a reviewer following the README
      # would hit a missing dependency, this job hits it first.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify the documented commands are importable
        run: |
          undertow --version
          python -c "import mcp, mcp_server_datahub, anthropic"

      - name: Tests
        run: pytest -q

      # Outside `testpaths`, so it needs asking for by name. It is the proposed
      # upstream contribution and has to keep working against the pinned SDK.
      - name: Proposed upstream patch builder
        run: pytest contrib/datahub-mlmodel-patch-builder/ -q

  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src/ tests/ scripts/

      - name: Mypy
        run: mypy src/
