[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "undertow"
version = "0.1.0"
description = "Lineage-grounded pre-deploy gate for production ML models, built on DataHub."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["datahub", "mlops", "lineage", "data-quality", "drift"]

dependencies = [
    # Floor is load-bearing, not cosmetic: MCP mutation tools are gated at
    # oss="1.4.0", and GMS must match. See docs/02-SYSTEM-ARCHITECTURE.md A.6.
    "acryl-datahub[datahub-rest]>=1.4.0,<2",
    "pydantic>=2.7,<3",
    "pyyaml>=6.0,<7",
    "click>=8.1,<9",
    "rich>=13.7,<14",
]

[project.optional-dependencies]
# The narrator is optional by design: the reporter falls back to templates so a
# missing key degrades prose, never the verdict.
narrator = ["anthropic>=0.40,<1"]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
    "ruff>=0.6,<1",
    "mypy>=1.11,<3",
    # `strict = true` treats PyYAML's missing stubs as an error without this.
    "types-PyYAML>=6.0,<7",
]

[project.scripts]
undertow = "undertow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/undertow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Lets `pytest` work from a clean checkout without an editable install first.
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
# The DataHub SDK ships partial stubs; don't let that block strictness on our code.
[[tool.mypy.overrides]]
module = ["datahub.*"]
ignore_missing_imports = true
