[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "undertow"
version = "0.1.0"
description = "Lineage-grounded pre-deploy gate for production ML models, built on DataHub."
readme = "README.md"
# 3.11 is the floor because `mcp-server-datahub` requires it, and the MCP read
# path is a first-class feature rather than an afterthought. Claiming 3.10 while
# the flagship integration cannot install there is worse than not claiming it.
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["datahub", "mlops", "lineage", "data-quality", "drift"]

dependencies = [
    # Floor is load-bearing, not cosmetic: MCP mutation tools are gated at
    # oss="1.4.0", and GMS must match. See docs/02-SYSTEM-ARCHITECTURE.md A.6.
    "acryl-datahub[datahub-rest]>=1.4.0,<2",
    "pydantic>=2.7,<3",
    "pyyaml>=6.0,<7",
    "click>=8.1,<9",
    "rich>=13.7,<14",
    # Core, not optional: the narrator's template fallback is imported at module
    # scope by the CLI, so without this `undertow --version` does not start.
    "jinja2>=3.1,<4",
    # Imported directly by the resolver to classify a connection failure into
    # one sentence. Always present as acryl-datahub's own transport, but "always
    # present transitively" is exactly the assumption that broke `--mcp` before —
    # anything imported by name gets declared by name.
    "requests>=2.31,<3",
    # Core, not optional: loaded at module scope by the CLI, the first thing it
    # does. Without it, ANTHROPIC_API_KEY / GROQ_API_KEY / etc. only work if
    # exported in the shell every session — a `.env` file is what most people
    # actually reach for, and it should work on a bare install.
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
# `--mcp`: reads resolve through the DataHub MCP server over stdio. The client
# library and the server are separate packages and Undertow needs both — the
# client to speak the protocol, the server to be the thing it speaks to.
mcp = [
    "mcp>=1.0,<2",
    "mcp-server-datahub>=0.6,<1",
]
# `--investigate` and LLM narration. Optional by design: the reporter falls back
# to templates and the investigator skips, so a missing key degrades prose and
# context, never the verdict.
#
# Two SDKs, not one: `anthropic` for the default provider, `openai` for the
# Groq/OpenRouter/generic path — everything that isn't Anthropic speaks the
# OpenAI-compatible wire format, so one client library covers all of them.
llm = ["anthropic>=0.40,<1", "openai>=1.0,<2"]
# Retained so `pip install undertow[narrator]` keeps working.
narrator = ["anthropic>=0.40,<1"]
# Everything a reviewer needs to exercise every documented command. `[dev]` is
# what the README tells people to install, so it has to be complete: an install
# that silently omits `--mcp` and `--investigate` is how a working feature reads
# as a broken one.
dev = [
    "mcp>=1.0,<2",
    "mcp-server-datahub>=0.6,<1",
    "anthropic>=0.40,<1",
    "openai>=1.0,<2",
    # `make seed` derives the fixture's lineage by running DataHub's SQL parser
    # over scripts/sql/. That parser needs sqlglot, which ships in this extra
    # rather than the base package. Undertow itself never imports it.
    "acryl-datahub[sql-parser]>=1.4.0,<2",
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
    "ruff>=0.6,<1",
    "mypy>=1.11,<3",
    # `strict = true` treats PyYAML's / requests' missing stubs as an error
    # without these.
    "types-PyYAML>=6.0,<7",
    "types-requests>=2.31,<3",
]

[project.scripts]
undertow = "undertow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/undertow"]
# The recorded graph `undertow demo` replays. It has to travel with the package:
# resolving it relative to the working directory only works from the repository
# root, which is the one place an installed tool cannot assume it is standing.
artifacts = ["src/undertow/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Lets `pytest` work from a clean checkout without an editable install first.
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
# The DataHub SDK ships partial stubs; don't let that block strictness on our code.
[[tool.mypy.overrides]]
module = ["datahub.*"]
ignore_missing_imports = true
